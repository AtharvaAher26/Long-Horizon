<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">System Architecture</text>

  <!-- User goal -->
  <rect x="380" y="50" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="480" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">User Goal</text>

  <!-- Layer container -->
  <rect x="40" y="110" width="880" height="320" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="418" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">MEMORY &amp; STATE INTEGRITY LAYER</text>

  <!-- Components -->
  <rect x="60" y="150" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Goal Ledger</text>
  <text x="170" y="205" text-anchor="middle" font-size="12" fill="#1e40af">write-once · protected</text>

  <rect x="370" y="150" width="220" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Drift Detector</text>
  <text x="480" y="205" text-anchor="middle" font-size="12" fill="#92400e">embeddings + LLM-as-Judge</text>

  <rect x="680" y="150" width="220" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="790" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Repair Module</text>
  <text x="790" y="205" text-anchor="middle" font-size="12" fill="#991b1b">soft / strong correction</text>

  <rect x="370" y="310" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Memory Store</text>
  <text x="480" y="365" text-anchor="middle" font-size="12" fill="#166534">typed · importance-scored</text>

  <rect x="60" y="310" width="220" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Compaction Engine</text>
  <text x="170" y="365" text-anchor="middle" font-size="12" fill="#5b21b6">safe summary + archive</text>

  <!-- Agent -->
  <rect x="340" y="470" width="280" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Agent (LLM + sandboxed tools)</text>

  <!-- Arrows -->
  <path d="M480 90 V100 H170 V150" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="300" y="94" text-anchor="middle" font-size="11" fill="#475569">given once</text>

  <line x1="280" y1="190" x2="370" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="325" y="181" text-anchor="middle" font-size="11" fill="#475569">frozen goal</text>

  <line x1="590" y1="190" x2="680" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="635" y="181" text-anchor="middle" font-size="11" fill="#475569">drift report</text>

  <line x1="480" y1="310" x2="480" y2="230" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="490" y="274" font-size="11" fill="#475569">agent state</text>

  <line x1="280" y1="350" x2="370" y2="350" stroke="#475569" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="325" y="341" text-anchor="middle" font-size="11" fill="#475569">summaries</text>

  <line x1="440" y1="470" x2="440" y2="390" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="430" y="454" text-anchor="end" font-size="11" fill="#475569">actions &amp; results</text>

  <path d="M790 230 V495 H620" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <text x="800" y="360" font-size="12" font-weight="700" fill="#dc2626">INTEGRITY</text>
  <text x="800" y="376" font-size="12" font-weight="700" fill="#dc2626">NOTICE</text>

  <text x="60" y="492" font-size="12" fill="#64748b">The agent never knows the layer exists.</text>
  <text x="60" y="510" font-size="12" fill="#64748b">The same layer wraps any agent, unchanged.</text>
</svg>
