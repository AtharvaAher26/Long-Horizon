<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Drift Scoring &amp; Response</text>
  <text x="480" y="64" text-anchor="middle" font-size="14" fill="#334155">alignment = 0.4 × embedding signal + 0.6 × LLM judge     ·     drift = 1 − alignment</text>

  <!-- Level bands -->
  <rect x="60" y="100" width="252" height="56" fill="#bbf7d0" stroke="#16a34a"/>
  <rect x="312" y="100" width="210" height="56" fill="#fde68a" stroke="#d97706"/>
  <rect x="522" y="100" width="168" height="56" fill="#fdba74" stroke="#ea580c"/>
  <rect x="690" y="100" width="210" height="56" fill="#fca5a5" stroke="#dc2626"/>
  <g text-anchor="middle" fill="#0f172a">
    <text x="186" y="124" font-size="15" font-weight="700">LOW</text>
    <text x="417" y="124" font-size="15" font-weight="700">MEDIUM</text>
    <text x="606" y="124" font-size="15" font-weight="700">HIGH</text>
    <text x="795" y="124" font-size="15" font-weight="700">CRITICAL</text>
    <text x="186" y="144" font-size="12">&lt; 0.30</text>
    <text x="417" y="144" font-size="12">0.30 – 0.55</text>
    <text x="606" y="144" font-size="12">0.55 – 0.75</text>
    <text x="795" y="144" font-size="12">≥ 0.75</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#64748b">
    <text x="60" y="176">0</text>
    <text x="312" y="176">0.30</text>
    <text x="522" y="176">0.55</text>
    <text x="690" y="176">0.75</text>
    <text x="900" y="176">1.0</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#334155">
    <text x="186" y="204">continue</text>
    <text x="417" y="204">soft correction (re-inject goal)</text>
    <text x="606" y="204">strong repair</text>
    <text x="795" y="204">strong repair now</text>
  </g>
  <text x="480" y="236" text-anchor="middle" font-size="12" fill="#64748b">Degraded mode: if the judge is unavailable, verdicts fall back to the embedding signal alone — the loop never blocks.</text>

  <!-- Calibration -->
  <text x="480" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Signal 1 calibration — gemini-embedding-001 cosine similarity</text>
  <rect x="340" y="326" width="420" height="26" fill="#dbeafe" stroke="#2563eb"/>
  <text x="550" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">alignment band [0.60, 0.75] → mapped linearly to 0 – 1</text>
  <line x1="60" y1="352" x2="900" y2="352" stroke="#475569" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12" fill="#64748b">
    <line x1="60" y1="348" x2="60" y2="356" stroke="#475569"/><text x="60" y="374">0.50</text>
    <line x1="340" y1="348" x2="340" y2="356" stroke="#475569"/><text x="340" y="374">0.60</text>
    <line x1="620" y1="348" x2="620" y2="356" stroke="#475569"/><text x="620" y="374">0.70</text>
    <line x1="760" y1="348" x2="760" y2="356" stroke="#475569"/><text x="760" y="374">0.75</text>
    <line x1="900" y1="348" x2="900" y2="356" stroke="#475569"/><text x="900" y="374">0.80</text>
  </g>
  <circle cx="220" cy="339" r="7" fill="#dc2626"/>
  <text x="220" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">goal ↔ drifting state</text>
  <text x="220" y="332" text-anchor="middle" font-size="0"> </text>
  <text x="220" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">0.557</text>
  <circle cx="763" cy="339" r="7" fill="#16a34a"/>
  <text x="810" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">0.751</text>
  <text x="810" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">goal ↔ aligned</text>

  <text x="480" y="412" text-anchor="middle" font-size="12" fill="#64748b">Clamped at the extremes: cosine ≤ 0.60 → 0 (drifting) · cosine ≥ 0.75 → 1 (aligned)</text>
  <text x="480" y="434" text-anchor="middle" font-size="12" fill="#64748b">Signal 2 (LLM-as-a-Judge) returns {alignment, problem_type, reason} — it catches intent problems like feature creep that embeddings miss.</text>
</svg>
