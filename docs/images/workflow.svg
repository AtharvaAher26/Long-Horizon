<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The Reflex Arc — One Run</text>

  <!-- Steps row -->
  <rect x="30" y="50" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">① Freeze goal</text>
  <text x="125" y="100" text-anchor="middle" font-size="12" fill="#1e40af">embed once, write-once</text>

  <rect x="260" y="50" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="355" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">② Agent acts</text>
  <text x="355" y="100" text-anchor="middle" font-size="12" fill="#334155">LLM + sandboxed tools</text>

  <rect x="490" y="50" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="585" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">③ Memory records</text>
  <text x="585" y="100" text-anchor="middle" font-size="12" fill="#166534">typed · importance-scored</text>

  <rect x="720" y="50" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="815" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">④ Drift check</text>
  <text x="815" y="100" text-anchor="middle" font-size="12" fill="#92400e">every 3 steps · 2 signals</text>

  <line x1="220" y1="85" x2="260" y2="85" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="450" y1="85" x2="490" y2="85" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="680" y1="85" x2="720" y2="85" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Verdict -->
  <line x1="815" y1="120" x2="815" y2="170" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="680" y="170" width="270" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="815" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Weighted verdict</text>
  <text x="815" y="217" text-anchor="middle" font-size="12" fill="#92400e">drift = 1 − (0.4·embedding + 0.6·judge)</text>

  <!-- Branches -->
  <path d="M815 232 V266 H465 V300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M815 266 H655 V300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M815 266 H850 V300" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="380" y="300" width="170" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="465" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">LOW</text>
  <text x="465" y="346" text-anchor="middle" font-size="12" fill="#166534">drift &lt; 0.30</text>
  <text x="465" y="364" text-anchor="middle" font-size="12" fill="#166534">continue</text>

  <rect x="570" y="300" width="170" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">MEDIUM</text>
  <text x="655" y="346" text-anchor="middle" font-size="12" fill="#92400e">0.30 – 0.55</text>
  <text x="655" y="364" text-anchor="middle" font-size="12" fill="#92400e">soft: re-inject goal</text>

  <rect x="760" y="300" width="180" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="850" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">HIGH / CRITICAL</text>
  <text x="850" y="346" text-anchor="middle" font-size="12" fill="#991b1b">≥ 0.55 · strong repair</text>
  <text x="850" y="364" text-anchor="middle" font-size="12" fill="#991b1b">importance-1.0 memory</text>

  <!-- Compaction -->
  <path d="M465 384 V420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M655 384 V420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M850 384 V420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="380" y="420" width="560" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">⑤ Memory over 30 items? → safe compaction</text>
  <text x="660" y="469" text-anchor="middle" font-size="12" fill="#5b21b6">ledger + corrections protected · raw items archived, never deleted</text>

  <!-- Loop back -->
  <path d="M380 452 H355 V120" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="30" y="440" font-size="12" fill="#64748b">↺ Next step: the agent reads the original</text>
  <text x="30" y="458" font-size="12" fill="#64748b">goal again and snaps back on track</text>

  <!-- Note -->
  <rect x="30" y="170" width="300" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="198" font-size="12" font-weight="700" fill="#334155">Design guarantees</text>
  <text x="46" y="220" font-size="12" fill="#475569">• The agent never knows the layer exists</text>
  <text x="46" y="238" font-size="12" fill="#475569">• Corrections are built verbatim from</text>
  <text x="56" y="254" font-size="12" fill="#475569">the Goal Ledger, never LLM-paraphrased</text>
</svg>
