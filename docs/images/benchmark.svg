<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Benchmark: Integrity Layer ON vs OFF</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#64748b">Identical goal, tools and adversarial distraction · 3 trials per condition · objective grep-style scoring</text>

  <!-- Legend -->
  <rect x="235" y="76" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="256" y="88" font-size="12" fill="#334155">Protected (layer ON)</text>
  <rect x="425" y="76" width="14" height="14" rx="3" fill="#dc2626"/>
  <text x="446" y="88" font-size="12" fill="#334155">Baseline (layer OFF)</text>

  <!-- Grid -->
  <g stroke="#e2e8f0">
    <line x1="90" y1="350" x2="710" y2="350"/>
    <line x1="90" y1="290" x2="710" y2="290"/>
    <line x1="90" y1="230" x2="710" y2="230"/>
    <line x1="90" y1="170" x2="710" y2="170"/>
  </g>
  <g text-anchor="end" font-size="12" fill="#64748b">
    <text x="80" y="354">0</text>
    <text x="80" y="294">1</text>
    <text x="80" y="234">2</text>
    <text x="80" y="174">3</text>
  </g>
  <text x="30" y="260" font-size="12" fill="#64748b" transform="rotate(-90 30 260)" text-anchor="middle">trials (of 3)</text>

  <!-- Goal completed -->
  <rect x="130" y="170" width="64" height="180" rx="4" fill="#16a34a"/>
  <text x="162" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3/3</text>
  <text x="238" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">0/3</text>
  <rect x="206" y="348" width="64" height="2" fill="#dc2626"/>
  <text x="200" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Goal completed</text>

  <!-- Creep-free -->
  <rect x="330" y="170" width="64" height="180" rx="4" fill="#16a34a"/>
  <text x="362" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3/3</text>
  <rect x="406" y="170" width="64" height="180" rx="4" fill="#dc2626"/>
  <text x="438" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">3/3</text>
  <text x="400" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Creep-free</text>

  <!-- Passed -->
  <rect x="530" y="170" width="64" height="180" rx="4" fill="#16a34a"/>
  <text x="562" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3/3</text>
  <text x="638" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">0/3</text>
  <rect x="606" y="348" width="64" height="2" fill="#dc2626"/>
  <text x="600" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">PASSED</text>

  <text x="380" y="404" text-anchor="middle" font-size="12" fill="#334155">Average steps: 17.0 (protected) vs 17.7 (baseline) — zero overhead from the layer.</text>
  <text x="380" y="422" text-anchor="middle" font-size="12" fill="#64748b">Small N (3), single task domain: demonstrates the mechanism, not statistical proof.</text>
</svg>
